services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag-retrieval-lab-postgres
    environment:
      # Superuser: only for migrations and seeding tenants.
      POSTGRES_USER: rag_admin
      POSTGRES_PASSWORD: rag_admin
      POSTGRES_DB: rag_lab
    ports:
      - '54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag_admin -d rag_lab']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
